# ==========================================
# 1. 站点基础信息
# ==========================================
site_name: 大模型评测方法论  # 极简一点，不要加括号里的长尾词
site_description: 从通用框架到RAG与Agent的工程化实践
site_author: kaling666666
site_url: https://kaling666666.github.io/LLM-Evaluation-Methodology/

repo_url: https://github.com/kaling666666/LLM-Evaluation-Methodology
repo_name: kaling666666/LLM-Evaluation-Methodology
copyright: Copyright &copy; 2026 kaling666666

# ==========================================
# 2. 主题与界面 (极简清爽风)
# ==========================================
theme:
  name: material
  language: zh

  features:
    # 彻底去掉 navigation.tabs，让导航老老实实待在左侧
    - navigation.instant   # 页面无刷新跳转
    - navigation.tracking  # 滚动时自动更新 URL 锚点
    - navigation.top       # 回到顶部按钮
    - search.suggest       # 搜索建议
    - search.highlight     # 搜索结果高亮
    - content.code.copy    # 代码块一键复制
    # 注意：去掉了 navigation.expand，这样左侧目录默认折叠，看起来更干净

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

  extra_css:
    - stylesheets/extra.css

# ==========================================
# 3. 导航与插件
# ==========================================
nav:
  - 首页: index.md
  - 第一章 评测总论: chapter-1.md
  - 第二章 RAG评测: chapter-2.md
  - 第三章 Agent评测: chapter-3.md
  - 第四章 评测补充: chapter-4.md
  - 第五章 常见问题: chapter-5.md

plugins:
  - search:
      lang: zh

# ==========================================
# 4. Markdown 扩展
# ==========================================
markdown_extensions:
  - admonition
  - tables
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true